# ==========================================
# DevFlow Application
# ==========================================

spring.application.name=DevFlow

# Server
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:1300/devflow
spring.datasource.username=devflow
spring.datasource.password=devflow123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


# ==========================================
# JSON
# ==========================================

#spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# Logging
# ==========================================

logging.level.root=INFO
logging.level.com.devflow=DEBUG


# ==========================================
# Scalar API Documentation
# ==========================================
scalar.enabled=true
scalar.url=/v3/api-docs
scalar.path=/scalar
scalar.pageTitle=DevFlow API Documentation

# ==========================================
# Keycloak / OAuth2 Resource Server
# ==========================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/devflow

# Keycloak Admin API - local development defaults
devflow.keycloak.server-url=${DEVFLOW_KEYCLOAK_SERVER_URL:http://localhost:8081}
devflow.keycloak.realm=${DEVFLOW_KEYCLOAK_REALM:devflow}
devflow.keycloak.admin-client-id=${DEVFLOW_KEYCLOAK_ADMIN_CLIENT_ID:devflow-provisioner}
devflow.keycloak.admin-client-secret=${DEVFLOW_KEYCLOAK_ADMIN_CLIENT_SECRET:}