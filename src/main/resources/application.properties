# ==========================================
# DevFlow Application
# ==========================================

spring.application.name=DevFlow

# ==========================================
# Server
# ==========================================
server.port=${SERVER_PORT:8080}

# ==========================================
# PostgreSQL
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:1300/devflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devflow123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ==========================================
# Flyway
# ==========================================
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ==========================================
# Logging
# ==========================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.chettra.devflow=${LOGGING_LEVEL_DEVFLOW:INFO}

# ==========================================
# Scalar API Documentation
# ==========================================
scalar.enabled=${SCALAR_ENABLED:true}
scalar.url=/v3/api-docs
scalar.path=/scalar
scalar.pageTitle=DevFlow API Documentation

# ==========================================
# Keycloak / OAuth2 Resource Server
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/devflow}

# ==========================================
# Keycloak Admin API
# ==========================================
devflow.keycloak.server-url=${DEVFLOW_KEYCLOAK_SERVER_URL:http://localhost:8081}
devflow.keycloak.realm=${DEVFLOW_KEYCLOAK_REALM:devflow}
devflow.keycloak.admin-client-id=${DEVFLOW_KEYCLOAK_ADMIN_CLIENT_ID:devflow-provisioner}
devflow.keycloak.admin-client-secret=${DEVFLOW_KEYCLOAK_ADMIN_CLIENT_SECRET:}
