services:
  postgres:
    image: postgres:16
    container_name: devflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: devflow
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow123
    ports:
      - "1300:5432"

    volumes:
      - devflow-postgres_data:/var/lib/postgresql/data

volumes:
  devflow-postgres_data:
