services:

  postgres:
    image: postgres:16
    container_name: devflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: devflow
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow123

    ports:
      - "1300:5432"

    volumes:
      - devflow-postgres_data:/var/lib/postgresql/data


  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: devflow-keycloak
    restart: unless-stopped

    command:
      - start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: devflow
      KC_DB_PASSWORD: devflow123

    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:

  devflow-postgres_data: